[options]
; ==============================================================================
; Odoo 17 - standalone configuration (rendered by install-odoo.sh)
;
; The installer replaces the ${...} placeholders with values from .env and
; writes the result to <instance>/etc/odoo.conf with mode 0600.
; Do not commit rendered secrets.
; ==============================================================================
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_port = 5432
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Direct access mode: allow the database manager on the published port.
list_db = True

; Logging
log_level = info
logfile = False
log_handler = :INFO

; Resource limits
workers = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
